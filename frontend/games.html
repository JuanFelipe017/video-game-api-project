<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GameHub — Explorar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/toast.css">
</head>

<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                <img src="assets/9d622c0f12194fb9a3f9e088cde7296b.jpg" alt="GameHub" height="38">
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Buscar juegos, géneros, plataformas...">
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="favorites.html" id="nav-favorites">Favoritos</a>
                <div id="nav-auth">
                    <a href="login.html" id="nav-login">Login</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>Explorar juegos</h1>
        </div>

        <!-- Grid de juegos — games.js lo llena dinámicamente -->
        <section class="section">
            <div class="games-grid" id="games-container">
                <!-- Las cards se insertan desde games.js -->
                <div class="loading-placeholder">Cargando juegos...</div>
            </div>

            <!-- Botón para paginación -->
            <div style="text-align:center; margin-top:40px;">
                <button id="load-more-btn" class="btn btn-green" style="padding:12px 32px; font-size:15px;">
                    Cargar más
                </button>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/games.js"></script>
</body>

</html>
