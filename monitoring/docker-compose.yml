services:

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: gamehub_blackbox
    restart: always
    # network_mode: host hace que blackbox comparta el network namespace
    # del host. Así puede llegar a "localhost:8000" si la API corre en
    # el host, o a URLs públicas si está en producción.
    network_mode: host
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts:
      - "host.docker.internal:127.0.0.1"

  prometheus:
    image: prom/prometheus:latest
    container_name: gamehub_prometheus
    restart: always
    network_mode: host
    volumes:
      - ./prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ./scripts/prometheus-entrypoint.sh:/entrypoint.sh:ro
      - prometheus_data:/prometheus
    environment:
      API_TARGET: ${API_TARGET}
    entrypoint: /entrypoint.sh

  # Nota: los 3 servicios usan network_mode: host (no red Docker bridge)
  # para que blackbox pueda llegar a la API cuando corre en localhost
  # del host (uvicorn directo). No hay sección `networks:` por eso.

  grafana:
    image: grafana/grafana:latest
    container_name: gamehub_grafana
    restart: always
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
