modules:
  http_gamehub_api:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 204, 301, 302, 400, 401, 403, 404, 405, 422]
      method: GET
      fail_if_ssl: false
      fail_if_body_matches_regexp:
        - "(?i)traceback"
        - "(?i)internal server error"
      headers:
        Accept: application/json
        User-Agent: "GameHub-Blackbox/1.0"
