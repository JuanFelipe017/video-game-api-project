name: CD Pipeline - Deploy a GCP

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy Backend a Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: gamehub-backend
          region: us-central1
          source: ./backend

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy Frontend a Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: gamehub-front-back
          region: us-central1
          source: ./frontend/HUB_GAMES
          build_environment_variables: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}